services:
  postgres:
    image: postgres:16-alpine
    container_name: dqchecker-postgres
    environment:
      POSTGRES_DB: dqchecker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: dqchecker-app
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dqchecker
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: mysecretkeymysecretkeymysecretkey1234567890
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"

volumes:
  postgres-data:
